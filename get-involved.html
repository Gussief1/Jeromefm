<head>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      background: #343434;
      color: #fff;
    }

:root{
  --maxw:1600px;
}

/* TOP BAR */
.topbar{
  max-width:var(--maxw);
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px;
}

#logo{
  height:128px;
  width:auto;
}


.right-wrap{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:64px;
}

    /* Click This button stays the same */
    .click-cta {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .click-cta img { height: 120px; }

nav.site-nav{
  display:flex;
  gap:20px;
  font-weight:600;
  font-size:20px;
}

nav.site-nav a{
  color:white;
  text-decoration:none;
  position:relative;
  font-family: "Cinzel", serif;
}

nav.site-nav a:after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:-4px; height:2px;
  background:currentColor;
  transform:scaleX(0);
  transform-origin:left;
  transition:.2s ease;
}

nav.site-nav a:hover:after{
  transform:scaleX(1);
}

.images-section {
  max-width: 1800px;
  margin: 200px auto 0 auto; /* lower the section */
  padding: 0 20px;
  display: flex;
  justify-content: center; /* keep centered */
  flex-wrap: wrap; /* wrap on small screens */
  gap: 50px; /* smaller gap, spacing handled naturally */
}

.images-section a img {
  width: 600px; /* bigger images */
  max-width: 100%; /* responsive */
  height: auto;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.2s;
}

    /* Responsive */
    @media (max-width: 780px) {
      .topbar { padding: 12px; }
      .brand img { height: 120px; }
      .click-cta img { height: 80px; }

      .images-section {
        flex-direction: column;
        gap: 30px;
        margin-top: 60px;
      }

      .images-section a img { width: 100%; }
    }
	
	/* Disable text selection */
button,
img,
a,
.click-cta,
.images-section img {
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

/* Remove outline highlight */
button:focus,
button:active,
img:focus,
img:active,
a:focus,
a:active {
  outline: none !important;
  border: none !important;
}

@media (max-width:500px) {

  /* Stack header nicely */
  .topbar {
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  /* Resize logo for mobile */
  #logo {
    height: 90px;
  }

  /* Center nav */
  .right-wrap {
    width: 100%;
    justify-content: center;
  }

  nav.site-nav {
    gap: 25px;
    font-size: 20px;       /* fits 3 links on iPhone 15 */
  }

  nav.site-nav a {
    white-space: nowrap;  /* prevents wrapping */
  }
}



  </style>
</head>
<body>

<header class="topbar">
  <div style="display:flex; flex-direction:column; align-items:flex-start; gap:5px;">
    <a href="index.html">
  <img id="logo" src="images/logo-left.png" alt="Station logo">
</a>
  </div>

  <div class="right-wrap">
    <nav class="site-nav" id="siteNav">
      <a href="index.html">Jerome Fm</a>
	  <a href="residents.html">Residents</a>
	  <a href="Shows.html">Shows</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>


  <!-- Images Section -->
  <section class="images-section">
    <!-- Show Time image opens Google Form in new tab -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScCP54c3MWiNJj1rjw4Cx2lO02Vxd7I5QhgzXPkFnmr-PUyuA/viewform?usp=sharing&ouid=107302087769293120798" target="_blank">
      <img src="images/show-time.png" alt="Show Time">
    </a>

    <!-- Donate image opens PayPal in new tab -->
    <a href="https://paypal.me/JeromeWWfm?country.x=US&locale.x=en_US" target="_blank">
      <img src="images/Donate.png" alt="Donate">
    </a>
  </section>

</body>
</html>
