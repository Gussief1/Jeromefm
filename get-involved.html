<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Involved with Jerome FM</title>

  <link rel="icon" href="images/logo-left.png" type="image/png">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YMTBM6H073"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-YMTBM6H073');
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      background: #343434;
      color: #fff;
      padding-bottom: 220px; /* Prevents video from covering page content */
    }

    :root {
      --maxw:1600px;
    }

    /* TOP BAR */
    .topbar {
      max-width:var(--maxw);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px;
    }

    #logo {
      height:128px;
      width:auto;
    }

    .right-wrap {
      display:flex;
      align-items:center;
      gap:12px;
      min-height:64px;
    }

    nav.site-nav {
      display:flex;
      gap:20px;
      font-weight:600;
      font-size:20px;
    }

    nav.site-nav a {
      color:white;
      text-decoration:none;
      position:relative;
      font-family: "Cinzel", serif;
    }

    nav.site-nav a:after {
      content:"";
      position:absolute;
      left:0; right:0; bottom:-4px; height:2px;
      background:currentColor;
      transform:scaleX(0);
      transform-origin:left;
      transition:.2s ease;
    }

    nav.site-nav a:hover:after {
      transform:scaleX(1);
    }

    /* MAIN SECTIONS */
    .images-section {
      max-width: 1800px;
      margin: 100px auto 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
    }

    .images-section a img {
      width: 600px;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .images-section a img:hover {
      transform: scale(1.02);
    }

    /* BOTTOM ADMIN & ACCESS CONTAINER */
    .admin-wrapper {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 9999;
    }

    .ops-link {
      background: none;
      border: none;
      color: #ccc;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      opacity: 0.85;
      transition: opacity 0.2s, color 0.2s;
      padding: 0;
    }

    .ops-link:hover {
      opacity: 1;
      color: #fff;
    }

    /* BOTTOM VIDEO LOGIN OVERLAY */
    .admin-video-overlay {
      width: 320px;            /* Increased width */
      height: 180px;           /* Height matching 16:9 aspect ratio */
      max-width: 90vw;         /* Prevents breaking on smaller mobile screens */
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 2px solid #555;
      cursor: pointer;
      display: block;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .admin-video-overlay:hover {
      transform: scale(1.05);
      border-color: #fff;
    }

    .admin-video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: fill;        /* Forces video to stretch and completely fill the container */
      display: block;
    }

    .hover-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-weight: bold;
      font-size: 20px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    /* MODAL POPUP FOR REQUEST ACCESS FORM */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .request-access-card {
      width: 90%;
      max-width: 500px;
      background: #242424;
      border: 1px solid #555;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: #fff;
    }

    .request-access-card h2 {
      margin-top: 0;
      font-family: "Cinzel", serif;
      font-size: 22px;
      color: #fff;
    }

    .request-access-card p {
      font-size: 14px;
      color: #ccc;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .access-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .form-group label {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bbb;
    }

    .form-group input, 
    .form-group textarea {
      padding: 10px;
      background: #181818;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: #888;
    }

    .submit-btn {
      background: #444;
      color: #fff;
      border: 1px solid #666;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin-top: 6px;
    }

    .submit-btn:hover {
      background: #555;
      border-color: #999;
    }

    /* Disable text selection */
    button, img, a, .images-section img, .admin-video-overlay {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Remove outline highlight */
    button:focus, button:active, img:focus, img:active, a:focus, a:active {
      outline: none !important;
    }

    /* Responsive */
    @media (max-width: 780px) {
      .topbar { padding: 12px; }
      #logo { height: 90px; }

      .images-section {
        flex-direction: column;
        gap: 30px;
        margin-top: 40px;
      }

      .images-section a img { width: 100%; }
    }

    @media (max-width:500px) {
      .topbar {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .right-wrap {
        width: 100%;
        justify-content: center;
      }

      nav.site-nav {
        gap: 25px;
        font-size: 20px;
      }

      nav.site-nav a {
        white-space: nowrap;
      }

      .admin-wrapper {
        bottom: 10px;
      }

      .admin-video-overlay {
        width: 180px;
        height: 100px;
      }

      .hover-text {
        font-size: 16px;
      }

      .ops-link {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div style="display:flex; flex-direction:column; align-items:flex-start; gap:5px;">
    <a href="index.html">
      <img id="logo" src="images/logo-left.png" alt="Station logo">
    </a>
  </div>

  <div class="right-wrap">
    <nav class="site-nav" id="siteNav">
      <a href="index.html">Jerome Fm</a>
      <a href="residents.html">Residents</a>
      <a href="Shows.html">Shows</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

  <!-- Images Section -->
  <section class="images-section">
    <!-- Show Time image opens Google Form in new tab -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScCP54c3MWiNJj1rjw4Cx2lO02Vxd7I5QhgzXPkFnmr-PUyuA/viewform?usp=sharing&ouid=107302087769293120798" target="_blank">
      <img src="images/show-time.png" alt="Show Time">
    </a>

    <!-- Donate image opens PayPal in new tab -->
    <a href="https://paypal.me/JeromeWWfm?country.x=US&locale.x=en_US" target="_blank">
      <img src="images/Donate.png" alt="Donate">
    </a>
  </section>

  <!-- Floating Admin & Request Access Wrapper -->
  <div class="admin-wrapper">
    <button class="ops-link" onclick="openModal()">want to help with operations?</button>

    <a href="admin/index.html" class="admin-video-overlay" id="adminVideoLink" title="Admin Login">
      <video id="loginVideo" autoplay loop muted playsinline>
        <source src="images/helpme.mp4" type="video/mp4">
      </video>
      <div class="hover-text">LOGIN</div>
    </a>
  </div>

  <!-- REQUEST ACCESS MODAL POPUP -->
  <div class="modal-overlay" id="accessModal" onclick="closeModalOnOverlay(event)">
    <div class="request-access-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>So you want to help with site development</h2>
      <p>Submit your details below to become involved</p>
      
      <form class="access-form" name="request-access" method="POST" data-netlify="true">
        <!-- Netlify hidden form field -->
        <input type="hidden" name="form-name" value="request-access" />

        <div class="form-group">
          <label for="artist-name">Name</label>
          <input type="text" id="artist-name" name="name" placeholder="Your Name" required />
        </div>

        <div class="form-group">
          <label for="artist-email">Email Address</label>
          <input type="email" id="artist-email" name="email" placeholder="yourname@example.com" required />
        </div>

        <div class="form-group">
          <label for="artist-notes">Why</label>
          <textarea id="artist-notes" name="notes" rows="3" placeholder="Why do you want to help Jerome FM"></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Request</button>
      </form>
    </div>
  </div>

  <script>
    const videoLink = document.getElementById('adminVideoLink');
    const loginVideo = document.getElementById('loginVideo');

    // Unmute audio on hover
    videoLink.addEventListener('mouseenter', () => {
      loginVideo.muted = false;
    });

    // Mute again when cursor leaves
    videoLink.addEventListener('mouseleave', () => {
      loginVideo.muted = true;
    });

    // Unmute on touch for mobile devices
    videoLink.addEventListener('touchstart', () => {
      loginVideo.muted = false;
    }, { passive: true });

    // Modal Control Functions
    function openModal() {
      document.getElementById('accessModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('accessModal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'accessModal') {
        closeModal();
      }
    }
  </script>

</body>
</html>
