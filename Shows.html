    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      background: #343434;
      color: #fff;
    }

    :root {
      --maxw: 1600px;
    }

    /* TOP BAR */
    .topbar {
      max-width: var(--maxw);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    #logo {
      height: 128px;
      width: auto;
    }

    .right-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
    }

    nav.site-nav {
      display: flex;
      gap: 20px;
      font-weight: 600;
      font-size: 20px;
    }

    nav.site-nav a {
      color: white;
      text-decoration: none;
      position: relative;
      font-family: "Cinzel", serif;
    }

    nav.site-nav a:after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -4px; height: 2px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: .2s ease;
    }

    nav.site-nav a:hover:after {
      transform: scaleX(1);
    }

    /* CONTROLS & CONTROLS CONTAINER (CENTERED) */
    .controls-container {
      max-width: var(--maxw);
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .sort-btn {
      background: #242424;
      border: 1px solid #555;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, border-color 0.2s;
    }

    .sort-btn:hover {
      background: #444;
      border-color: #888;
    }

    /* SHOWS GRID */
    .shows-grid {
      max-width: var(--maxw);
      margin: 0 auto 60px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
    }

    .show {
      background: #242424;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #444;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .show:hover {
      transform: translateY(-4px);
      border-color: #888;
    }

    .show a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* SQUARE IMAGES */
    .show img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .show-title {
      font-size: 18px;
      font-weight: bold;
      padding: 14px 16px 4px 16px;
      color: #fff;
    }

    .show-date {
      font-size: 14px;
      color: #aaa;
      padding: 0 16px 14px 16px;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 780px) {
      #logo { height: 90px; }
      .shows-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
      }
    }

    /* MOBILE: 2 SHOWS PER ROW */
    @media (max-width: 500px) {
      .topbar {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .shows-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 10px;
      }
      .show-title {
        font-size: 14px;
        padding: 8px 10px 2px 10px;
      }
      .show-date {
        font-size: 12px;
        padding: 0 10px 8px 10px;
      }
    }

  // 2. LOAD HARDCODED + AUTOMATICALLY FETCH CMS SHOWS
  async function loadShows() {
    shows = [...hardcodedShows];

    try {
      const repoRes = await fetch("https://api.github.com/repos/Gussief1/Jeromefm/contents/data/shows");
      if (repoRes.ok) {
        const files = await repoRes.json();

        for (const file of files) {
          if (file.name.endsWith(".json")) {
            const res = await fetch(file.download_url);
            if (res.ok) {
              const data = await res.json();
              const id = file.name.replace(".json", "");
              shows.push({
                title: data.title,
                date: data.date,
                image: data.image,
                page: `Shows/show.html?id=${id}`
              });
            }
          }
        }
      }
    } catch (e) {
      console.error("Could not load CMS shows:", e);
    }

    sortNewest();
  }

function displayShows() {
    const container = document.getElementById("showContainer");
    container.innerHTML = "";

    shows.forEach(show => {
      // encodeURI fixes special characters like 'ñ' or spaces in file paths
      const safeImageUrl = encodeURI(show.image);

      container.innerHTML += `
        <div class="show">
          <a href="${show.page}">
            <img src="${safeImageUrl}" alt="${show.title}">
            <div class="show-title">${show.title}</div>
            <div class="show-date">${formatDate(show.date)}</div>
          </a>
        </div>
      `;
    });
  }

  function formatDate(dateStr) {
    if (!dateStr) return "";
    const [year, month, day] = dateStr.split("T")[0].split("-");
    return new Date(year, month - 1, day).toDateString();
  }

  function sortNewest() {
    shows.sort((a, b) => new Date(b.date) - new Date(a.date));
    displayShows();
  }

  function sortOldest() {
    shows.sort((a, b) => new Date(a.date) - new Date(b.date));
    displayShows();
  }

  function shuffleShows() {
    for (let i = shows.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shows[i], shows[j]] = [shows[j], shows[i]];
    }
    displayShows();
  }

  loadShows();
