<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="../../images/logo-left.png">

  <!-- Google tag (gtag.js) -->

  <style>
    body {
      background:#b8d2ff;
      color:#fff;
      font-family: Arial, sans-serif;
      text-align:center;
      margin:0;
      padding:40px;
      text-shadow: 0 1px 2px #000, 0 0 1px #000;
    }

    img {
      max-width:400px;
      border-radius:12px;
    }

    a {
      color:#fff;
      text-decoration:underline;
    }
	
    /* TOP BAR LINKS */
    .top-right-links {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      gap: 16px;
      z-index: 1000;
    }

    .top-right-links a {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
    }

    .top-right-links a:hover {
      text-decoration: underline;
    }

    /* RESIDENT DROPDOWN CONTAINER */
    .resident-select-container {
      position: absolute;
      top: 20px;
      left: 20px;
      text-align: left;
    }

    .resident-select-container label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .resident-select-container select {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #fff;
      background: #343434;
      color: #fff;
      cursor: pointer;
    }

    /* SHOW BIO */
    .show-bio {
      max-width:700px;
      margin:40px auto 0;
      font-size:20px;
      line-height:1.6;
      color:#000;
      text-shadow: none;
    }

    /* Clickable show art */
    a img {
      cursor: pointer;
    }

    a img:hover {
      opacity: 0.9;
    }

    h2 a {
      color: inherit;
      text-decoration: none;
    }

    h2 a:hover {
      text-decoration: underline;
    }

    /* MOBILE STIPULATIONS */
    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      .top-right-links {
        position: static;
        justify-content: center;
        margin-bottom: 16px;
      }

      .resident-select-container {
        position: static;
        margin: 0 auto 20px;
        text-align: center;
      }

      h1 {
        font-size: 26px;
        margin-top: 8px;
      }

      h2 {
        margin-top: 28px;
      }

      img {
        max-width: 100%;
        height: auto;
        margin-top: 16px;
      }

      .show-bio {
        margin-top: 24px;
        padding: 16px;
        font-size: 16px;
        line-height: 1.5;
      }
    }

    @media (min-width: 1100px) {
      .top-right-links {
        gap: 24px;
      }

      .top-right-links a {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

<div class="top-right-links">
  <a href="../../index.html">Jerome FM</a>
  <a href="../../Shows.html">Shows</a>
</div>

<div style="position:relative;">

  <!-- RESIDENT DROPDOWN -->
  <div class="resident-select-container">
    <label for="residentSelect">Select Resident:</label>
    <select id="residentSelect" onchange="navigateToResident(this.value)">
      <option value="">-- Choose a Resident --</option>
    </select>
  </div>

  <h1 class="show-title">AN System</h1>

  <p class="show-date">July 10th, 2026</p>

  <a href="https://soundcloud.com/jerome_fm/an-system-with-dj-xnx-10-07-26" target="_blank" rel="noopener" class="show-art">
    <img src="../../Shows-art/July-2026/an system_10.07.2026.jpg" alt="AN System Show Art">
  </a>

  <h2 class="listen">
    <a href="https://soundcloud.com/jerome_fm/an-system-with-dj-xnx-10-07-26" target="_blank" rel="noopener">
      ← Listen on SoundCloud
    </a>
    <br>
  </h2>

  <a href="../../Shows.html" class="back-link">← Back to Shows</a>

</div>

<script>
  // Hardcoded residents list with adjusted root path prefix
  const oldResidents = [
    { name: "Joragon", link: "residents/Joragon.html" },
    { name: "Rare Plastic", link: "residents/Rare Plastic.html" },
    { name: "Gussief1", link: "residents/Gussief1.html" },
    { name: "☁", link: "residents/Cloud.html" },
    { name: "noky", link: "residents/noky.html" },
    { name: "ZERO FUCKS GIVEN RADIO (hosted by SUS1ER)", link: "residents/ZERO FUCKS GIVEN RADIO.html" },
    { name: "Worli", link: "residents/Worli.html" },
    { name: "4th-I Riddle C", link: "residents/4th-I Riddle C.html" },
    { name: "DJ RUIM", link: "residents/DJ RUIM.html" },
    { name: "Eña", link: "residents/ena.html" },
    { name: "Love Higher", link: "residents/Love-Higher.html" },
    { name: "AN System", link: "residents/AN-System.html" },
    { name: "blinx", link: "residents/blinx.html" },
    { name: "sddp", link: "residents/sddp.html" },
    { name: "Entrañas", link: "residents/Entrañas.html" },
    { name: "Knarf", link: "residents/Knarf.html" },
    { name: "Nocturnal Wax", link: "residents/Nocturnal Wax.html" },
    { name: "Aeon Shaker", link: "residents/Aeon Shaker.html" },
    { name: "Louis Me", link: "residents/Louis Me.html" },
    { name: "Koh", link: "residents/Koh.html" },
    { name: "Request Access", link: "residents/Request-Access.html" },
    { name: "BOY BVRKE", link: "residents/BOY BVRKE.html" },
    { name: "Nishévitha", link: "residents/Nishévitha.html" },
    { name: "Sayat Lova", link: "residents/Sayat Lova.html" },
    { name: "Impulso-Re", link: "residents/ImpulsoRe.html" },
    { name: "DJ Land Reform", link: "residents/DJ Land Reform.html" },
    { name: "zolf", link: "residents/zolf.html" },
    { name: "syntrovert + friends 𓆝 𓆟 𓆞", link: "residents/syntrovert & friends.html" },
    { name: "pillbreakerr", link: "residents/pillbreakerr.html" },
    { name: "Icarus Redux", link: "residents/Icarus Redux.html" },
    { name: "fourplay", link: "residents/fourplay.html" },
    { name: "Heat Check", link: "residents/Heat Check.html" },
    { name: "NANAGOTCHI", link: "residents/NANAGOTCHI.html" },
    { name: "Derek Piotr", link: "residents/derek-piotr.html" },
    { name: "FATE/faith", link: "residents/fate-faith.html" },
    { name: "KUNAI", link: "residents/KUNAI.html" },
    { name: "Redface Radio", link: "residents/Redface Radio.html" },
    { name: "Byna", link: "residents/Byna.html" }
  ];

  let residents = [];

  async function loadResidentsDropdown() {
    residents = [...oldResidents];

    // Fetch CMS Residents from GitHub
    try {
      const repoRes = await fetch("https://api.github.com/repos/Gussief1/Jeromefm/contents/data/residents");
      if (repoRes.ok) {
        const files = await repoRes.json();
        for (const file of files) {
          if (file.name.endsWith(".json")) {
            const res = await fetch(file.download_url);
            if (res.ok) {
              const data = await res.json();
              const id = file.name.replace(".json", "");
              const residentName = data.title || data.name || "Unknown Resident";
              residents.push({
                name: residentName,
                link: `residents/profile.html?id=${id}`
              });
            }
          }
        }
      }
    } catch (e) {
      console.error("Could not load CMS residents:", e);
    }

    // Sort Alphabetically
    residents.sort((a, b) => (a.name || "").localeCompare(b.name || ""));

    // Populate Dropdown
    const selectEl = document.getElementById("residentSelect");
    residents.forEach(r => {
      const option = document.createElement("option");
      // Prepend path to escape current nested show directory back to site root
      option.value = "../../" + r.link;
      option.textContent = r.name;
      selectEl.appendChild(option);
    });
  }

  function navigateToResident(url) {
    if (url) {
      window.location.href = url;
    }
  }

  loadResidentsDropdown();
</script>

</body>
</html>
