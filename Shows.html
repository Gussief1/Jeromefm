  <style>
    :root {
      --bg:#343434;
      --ink:#fff;
      --maxw:1600px;
    }

    * { box-sizing:border-box; }

    html, body {
      height:100%;
      margin:0;
    }

    body {
      font-family: Arial, sans-serif;
      color:var(--ink);
      background:var(--bg);
      overflow-x:hidden;
      text-align:center;
    }

    button, img, a {
      user-select:none;
      -webkit-user-select:none;
    }

    /* TOP BAR */
    .topbar{
      max-width:var(--maxw);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px;
    }

    #logo{
      height:128px;
      width:auto;
    }

    .right-wrap{
      display:flex;
      align-items:center;
      gap:12px;
      min-height:64px;
    }

    nav.site-nav {
      display:flex;
      gap:20px;
      font-weight:600;
      font-size:20px;
    }

    nav.site-nav a {
      color:white;
      text-decoration:none;
      position:relative;
    }

    nav.site-nav a:after {
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-4px;
      height:2px;
      background:currentColor;
      transform:scaleX(0);
      transform-origin:left;
      transition:.2s ease;
    }

    nav.site-nav a:hover:after {
      transform:scaleX(1);
    }

    /* BUTTONS */
    .buttons {
      margin:20px 0;
    }

    .buttons button {
      background:#111;
      color:#fff;
      border:1px solid #555;
      padding:10px 18px;
      font-size:16px;
      cursor:pointer;
      border-radius:6px;
      transition:0.2s;
      margin:0 5px;
    }

    .buttons button:hover {
      background:#222;
      border-color:#888;
    }

    /* SHOW GRID */
    .show-list {
      max-width:var(--maxw);
      margin:0 auto;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:40px;
      padding:20px;
    }

    .show {
      width:250px;
      text-align:center;
    }

    .show img {
      width:250px;
      height:250px;
      object-fit:cover;
      border-radius:12px;
    }

    .show-title {
      margin-top:12px;
      font-size:20px;
      font-weight:bold;
    }

    .show-date {
      font-size:14px;
      opacity:0.7;
      margin-top:4px;
    }

    .footer-note {
      margin-top:40px;
      font-size:12px;
      opacity:0.7;
    }

    @media (max-width:800px) {
      .show { width:45%; }
      .show img { width:100%; height:auto; }
    }

    @media (max-width:500px) {
      .topbar {
        flex-direction:column;
        gap:10px;
      }

      #logo { height:90px; }

      .show-title { font-size:16px; }
      .show-date { font-size:12px; }
    }

function displayShows() {
  const container = document.getElementById("showContainer");
  container.innerHTML = "";

  shows.forEach(show => {
    container.innerHTML += `
      <div class="show">
        <a href="${show.page}">
          <img src="${show.image}" alt="${show.title}">
          <div class="show-title">${show.title}</div>
          <div class="show-date">
            ${formatDate(show.date)}
          </div>
        </a>
      </div>
    `;
  });
}

function formatDate(dateStr) {
  const [year, month, day] = dateStr.split("-");
  return new Date(year, month - 1, day).toDateString();
}


  function sortNewest() {
    shows.sort((a, b) => new Date(b.date) - new Date(a.date));
    displayShows();
  }

  function sortOldest() {
    shows.sort((a, b) => new Date(a.date) - new Date(b.date));
    displayShows();
  }

  function shuffleShows() {
    for (let i = shows.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shows[i], shows[j]] = [shows[j], shows[i]];
    }
    displayShows();
  }

  sortNewest(); // default load
</script>
