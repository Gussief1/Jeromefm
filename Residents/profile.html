<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resident Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/logo-left.png" type="image/png">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YMTBM6H073"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YMTBM6H073');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #b8d2ff;
      margin: 0;
    }
    .pfp {
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      display: block;
      margin: 20px 0;
    }
    .social-icons {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .social-icons img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .top-right-links {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 8px 12px;
    }
    .top-right-links a {
      font-size: 16px;
      color: black;
      text-decoration: none;
      margin-left: 15px;
      font-weight: bold;
    }
    .top-right-links a:hover {
      text-decoration: underline;
    }
    .bio p {
      margin: 4px 0;
      white-space: pre-line;
    }
    @media (max-width: 600px) {
      body {
        padding: 15px;
        padding-top: 70px;
        text-align: center;
      }
      .top-right-links {
        position: fixed;
        top: 0; left: 0; right: 0;
        background: #b8d2ff;
        z-index: 1000;
        padding: 10px 0;
        text-align: center;
      }
      .social-icons {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="top-right-links">
  <a href="../index.html">Jerome Fm</a>
  <a href="../Residents.html">Residents</a>
</div>

<h1 id="res-name">Loading...</h1>
<img id="res-pfp" class="pfp" src="" alt="Profile Picture">

<div class="social-icons" id="res-socials"></div>

<div class="bio">
  <p id="res-bio"></p>
</div>

<p style="font-size: 12px; margin-top: 100px;">
  * Residents may edit this page via Decap CMS Admin dashboard.
</p>

<script>
  const socialMap = [
    { key: 'ra', icon: '../images/RA.png', label: 'Resident Advisor' },
    { key: 'soundcloud', icon: '../images/soundcloud.png', label: 'Soundcloud' },
    { key: 'bandcamp', icon: '../images/bandcamp.png', label: 'Bandcamp' },
    { key: 'web', icon: '../images/web.png', label: 'Website' },
    { key: 'instagram', icon: '../images/instagram.png', label: 'Instagram' },
    { key: 'instagram2', icon: '../images/Instagram-2.png', label: 'Instagram 2' },
    { key: 'tiktok', icon: '../images/tiktok.png', label: 'Tiktok' },
    { key: 'twitter', icon: '../images/twitter.png', label: 'Twitter' },
    { key: 'nina', icon: '../images/nina.png', label: 'Nina Protocol' },
    { key: 'linktree', icon: '../images/Linktree.png', label: 'Linktree' },
    { key: 'youtube', icon: '../images/Youtube.png', label: 'Youtube' },
    { key: 'corus', icon: '../images/corus.png', label: 'Corus FM' }
  ];

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  if (id) {
    fetch(`../data/residents/${id}.json`)
      .then(res => res.json())
      .then(data => {
        document.title = data.name;
        document.getElementById('res-name').textContent = data.name;
        document.getElementById('res-pfp').src = data.pfp;
        document.getElementById('res-bio').textContent = data.bio;

        const socialsContainer = document.getElementById('res-socials');
        socialsContainer.innerHTML = '';

        socialMap.forEach(item => {
          if (data[item.key]) {
            socialsContainer.innerHTML += `
              <a href="${data[item.key]}" target="_blank" title="${item.label}">
                <img src="${item.icon}" alt="${item.label}">
              </a>
            `;
          }
        });
      })
      .catch(err => {
        document.getElementById('res-name').textContent = 'Resident Not Found';
      });
  }
</script>

</body>
</html>
