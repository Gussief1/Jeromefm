    body {
      background:#b8d2ff;
      color:#fff;
      font-family: Arial, sans-serif;
      text-align:center;
      margin:0;
      padding:40px;
    }

    img {
      max-width:400px;
      border-radius:12px;
    }

    a {
      color:#fff;
      text-decoration:underline;
    }
	
	/* TOP BAR LINKS */
.top-right-links {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  gap: 16px;
  z-index: 1000;
}

.top-right-links a {
  color: #fff;
  text-decoration: none;
  font-size: 20px;
}

.top-right-links a:hover {
  text-decoration: underline;
}

	
/* RESIDENT BADGE */
.resident-badge {
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.resident-badge img {
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,0.6);
}

.resident-name {
  font-size:24px;
  font-weight:600;
  text-align:left;
}
.resident-img-link,
.resident-name-link {
  text-decoration:none;
  color:inherit;
  display:inline-block;
}


/* SHOW BIO */
.show-bio {
  max-width:700px;
  margin:40px auto 0;
  font-size:20px;
  line-height:1.6;
  color:#000;
}


/* GLOBAL TEXT SHADOW (default) */
body {
  color:#fff;
  text-shadow:
    0 1px 2px #000,
    0 0 1px #000;
}

/* Clickable show art */
a img {
  cursor: pointer;
}

a img:hover {
  opacity: 0.9;
}


/* =========================
   MOBILE STIPULATIONS
   Individual Show Pages
========================= */
@media (max-width: 600px) {

  /* Page padding */
  body {
    padding: 20px;
  }

  /* Resident badge moves into flow */
  .resident-badge {
    position: static;
    justify-content: center;
    margin-bottom: 16px;
  }

  .resident-badge img {
    width: 90px;
    height: 90px;
  }

  .resident-name {
    font-size: 18px;
    text-align: center;
  }



  /* Headings */
  h1 {
    font-size: 26px;
    margin-top: 8px;
  }

  h2 {
    margin-top: 28px;
  }

  /* Show art */
  img {
    max-width: 100%;
    height: auto;
    margin-top: 16px;
  }

  /* Bio block */
  .show-bio {
    margin-top: 24px;
    padding: 16px;
    font-size: 16px;
    line-height: 1.5;
  }
}

h2 a {
  color: inherit;
  text-decoration: none;
}

h2 a:hover {
  text-decoration: underline;
}

/* =========================
   TABLET / HALF-SCREEN FIX
========================= */
@media (min-width: 600px) and (max-width: 1100px) {

  /* Put resident badge back into document flow */
  .resident-badge {
    position: relative;
    top: auto;
    left: auto;
    justify-content: center;
    margin: 20px auto 30px;
  }

  .resident-badge img {
    width: 120px;
    height: 120px;
  }

  .resident-name {
    font-size: 20px;
    text-align: center;
  }
}

@media (max-width: 600px) {
  .top-right-links {
    position: static;
    justify-content: center;
    margin-bottom: 16px;
  }
}

@media (min-width: 1100px) {
  .top-right-links {
    gap: 24px;
  }

  .top-right-links a {
    font-size: 30px;
  }
}
