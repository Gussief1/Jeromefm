backend:
  name: git-gateway
  branch: main

media_folder: "Resident images"
public_folder: "../Resident images"

collections:
  - name: "residents"
    label: "Residents"
    folder: "data/residents"
    create: true
    format: "json"
    slug: "{{title}}"
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Profile Picture", name: "pfp", widget: "image", required: false }
      - { 
          label: "Bio", 
          name: "bio", 
          widget: "markdown", 
          required: false,
          buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "quote", "bulleted-list", "numbered-list"],
          editor_components: ["image"],
          modes: ["raw", "rich_text"]
        }
      - { 
          label: "Discography / Key Releases", 
          name: "tracklist", 
          widget: "list", 
          required: false,
          field: { label: "Release / Track", name: "track", widget: "string" }
        }
      - { label: "Instagram", name: "instagram", widget: "string", required: false }
      - { label: "Instagram 2", name: "instagram2", widget: "string", required: false }
      - { label: "SoundCloud", name: "soundcloud", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }
      - { label: "Resident Advisor", name: "ra", widget: "string", required: false }
      - { label: "TikTok", name: "tiktok", widget: "string", required: false }
      - { label: "Twitter", name: "twitter", widget: "string", required: false }
      - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "Nina Protocol", name: "nina", widget: "string", required: false }
      - { label: "Linktree", name: "linktree", widget: "string", required: false }
      - { label: "Corus FM", name: "corus", widget: "string", required: false }
      - { label: "Other Link", name: "web", widget: "string", required: false }

  - name: "shows"
    label: "Shows"
    folder: "data/shows"
    create: true
    format: "json"
    slug: "{{custom_slug}}"
    fields:
      - { label: "File Name (Short Identifier)", name: "custom_slug", widget: "string", hint: "Enter a short custom filename without spaces (e.g. show-12)" }
      - { label: "Show Title", name: "title", widget: "string" }
      - { label: "Broadcast Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Show Artwork", name: "image", widget: "image" }
      - { label: "SoundCloud or Mixcloud Embed or Link", name: "soundcloud_url", widget: "string", required: false }
      - { label: "Resident Name", name: "resident_name", widget: "string", required: false }
      - { label: "Resident Profile Picture", name: "resident_pfp", widget: "image", required: false }
      - { 
          label: "Resident Link", 
          name: "resident_link", 
          widget: "relation", 
          collection: "residents", 
          search_fields: ["title"], 
          value_field: "residents/profile.html?id={{slug}}", 
          display_fields: ["title"], 
          required: false 
        }
      - { 
          label: "Description", 
          name: "body", 
          widget: "markdown", 
          required: false,
          buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "quote", "bulleted-list", "numbered-list"],
          modes: ["raw", "rich_text"]
        }
      - { 
          label: "Tracklist", 
          name: "tracklist", 
          widget: "list", 
          required: false,
          field: { label: "Track", name: "track", widget: "string" }
        }

  - name: "editorial"
    label: "Editorial"
    folder: "data/editorial"
    create: true
    format: "json"
    media_folder: "../../Editorial-images"
    public_folder: "../Editorial-images"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author / DJ", name: "author", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { 
          label: "Article Body", 
          name: "body", 
          widget: "markdown", 
          required: false,
          buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "quote", "bulleted-list", "numbered-list"],
          editor_components: ["image"],
          modes: ["raw", "rich_text"]
        }