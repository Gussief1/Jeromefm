/* TOP BAR */

nav.site-nav{

nav.site-nav a{

}

nav.site-nav a:after{
  content:"";

  transform:scaleX(0);

nav.site-nav a:hover:after{

/* Player layout */
.player-section {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 36px;
  display: flex;
  justify-content: flex-start;
  
}


.player-wrap {
  background: transparent;
  padding: 0;
  width: auto;
  display: flex;
  align-items: center;
  gap: 100px;
  margin-right: 250px;
  margin-top: 200px;
}

.player-btn {
  border: 0;
  background: transparent;
  cursor: pointer;
  width: 200px;
  height: 200px;
}

.player-btn img,
.volume-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.player-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#liveStatus img {
  width: 100px;
  margin-top: 12px;
  margin-right: 60px;
  display: none;
}


.volume-area {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 200px;
}

.volume-btn {
  width: 100px;
  height: 100px;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.volume-slider {
  display: none;
  position: absolute;
  left: 80px;
  top: 90%;
  transform: translateY(-50%);
  width: 120px;
}

/* Base slider */
.volume-slider input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  background: #000;
  border-radius: 10px;
  outline: none;
  cursor: pointer;
}

/* Chrome / Safari thumb */
.volume-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  cursor: pointer;
}

/* Firefox thumb */
.volume-slider input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  cursor: pointer;
}

/* Firefox track */
.volume-slider input[type="range"]::-moz-range-track {
  background: #000;
  height: 6px;
  border-radius: 10px;
}


/* Chatango */
.chatango-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 300px;
  height: 400px;
  z-index: 9999;
  border-radius: 8px;
  overflow: hidden;
  background: transparent;
  outline: none !important;
}

/* Mobile */
@media (max-width:780px){
  .brand img, .click-cta img { height:48px; }

    flex-direction: column;
    gap: 20px;
    margin-right: 0;
    margin-top: 20px;
  }
  .player-btn { width: 120px; height: 120px; }
  .volume-btn { width: 60px; height: 60px; }
  .chatango-container {
    width: 180px;
    height: 250px;
    bottom: 10px;
    right: 10px;
  }
}

@media (max-width:480px){
  .chatango-container { display:none; }
}

/* Signup text and box */
.signup-box input {
  padding:6px;
  font-size:16px;
}

.signup-box button {
  padding:6px 10px;
  font-size:16px;
  cursor:pointer;
}

#emailBox {

  left: 0px;
  margin-top: 10px;

  padding: 8px;
  border-radius: 6px;
  z-index: 10001; 
}

#emailBox {

  opacity: 0;

}

#emailBox.open {
  max-height: 200px;
  opacity: 1;
}



#logo {

  transition: transform 0.5s ease;
  height:128px;
  cursor: grab;
}

@media (max-width: 480px) {
  .big-logo { display: none; }
}

#schedule {
  position: fixed;
  top: 220px;
  bottom: var(--track-gap);   /* protected track area */
  left: 20px;
  width: 420px;
  padding: 16px;

  overflow-y: auto;          
  overflow-x: hidden;

  filter: drop-shadow(0 15px 30px rgba(0,0,0,0.66));
  transition: transform 0.3s ease, opacity 0.3s ease;
}

/* Hide scrollbar but allow scrolling */
#schedule {
  scrollbar-width: none;          /* Firefox */
  -ms-overflow-style: none;       /* IE / Edge */
}

#schedule::-webkit-scrollbar {
  display: none;                  /* Chrome / Safari */
}

@media (max-width: 780px) {
  .right-wrap {
    width: 100vw;
    justify-content: center;
  }

  nav.site-nav {
    width: 100%;
    justify-content: center;
    text-align: center;
  }

  nav.site-nav a:last-child {
    margin-left: -10px;
  }

  .volume-area {
    display: none;
  }

  .player-wrap {
    margin-top: 150px !important;
  }

#currentTrack {
  position: fixed;
  bottom: 48px;        /* pushes it BELOW live button */
  left: 10px;

  font-size: 16px;
  line-height: 1.2;
  max-width: 75vw;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  z-index: 9999;
}


  /* chat note */
  .mobile-chat-note {
    display: block;
  }
}



/* Hidden state */
#schedule.collapsed {
  transform: translateX(-110%);
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 900px) {
  #schedule {
    position: relative;
    top: auto;
    left: auto;
    width: calc(100% - 32px);
    max-height: 40vh;
    margin: 20px auto;
  }
}

@media (max-width: 480px) {
  #schedule {
    top: 10%;
    bottom: calc(var(--track-gap) + 16px);
    left: 16px;
    right: 16px;

    width: auto;
    max-height: none;

    overflow-y: auto;
    border-radius: 12px;
    background: #fff;
  }
}



  #schedule h2 {
    font-size: 18px;
  }
}

@media (max-width: 480px) {
  #scheduleToggle {
    top: auto;
    bottom: 20px;
    left: 20px;
  }
}

@media (max-width: 480px) {
  #scheduleToggle {
    width: 28px;
    height: 28px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    line-height: 1;

    border-radius: 50%;
  }

  #scheduleToggle .label {
    display: none;
  }
}

/* =========================
   MOBILE SCHEDULE MODAL
========================= */
@media (max-width: 480px) {

  /* Dark backdrop */
  #scheduleBackdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 0;
  }

  /* Floating schedule box */
  #schedule {
    position: fixed;
    inset: auto 16px 16px 16px;
    top: 10%;
    bottom: auto;

    width: auto;
    max-height: 70vh;
    overflow-y: auto;

    background: #fff;
    padding: 16px;
    border-radius: 12px;

    z-index: 999;

    transform: scale(0.95);
    opacity: 0;
    pointer-events: none;

    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  /* Visible state */
  #schedule:not(.collapsed) {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
  }
}

@media (max-width: 480px) {
  .social-media {
    z-index: 10 !important;   /* BELOW backdrop (998) */
  }
}

@media (max-width: 480px) {
  #emailBox {
    margin-top: 75px;   /* pushes it lower */
  }
}

/* Compact schedule spacing */
#schedule h3 {
  margin: 8px 0 4px;
  font-size: 16px;
  line-height: 1.1;
  text-decoration: underline;
  font-weight: 600;
}


#scheduleContent div {
  margin: 2px 0 8px;     /* tighter vertical spacing */
  font-size: 15px;
  line-height: 1.2;
}

#scheduleContent strong {
  display: block;        /* keeps time on its own line */
  font-size: 14px;
  margin-bottom: 0px;
}

.show-title {
  display: block;
  margin-top: 0;
  padding-top: 0;
  line-height: 1.15;
}

.schedule-time {
  font-style: italic;
  font-size: 14px;
  display: block;
}

.show-title {
  font-weight: bold;
  line-height: 1.15;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Flashing red live dot */
.live-dot {
  width: 8px;
  height: 8px;
  background: red;
  border-radius: 50%;
  animation: pulse 4s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}


  nav.site-nav {
    justify-content: center;   /* centers the links inside */
    width: 100%;
  }
}

  nav.site-nav {
    width: 100%;
    justify-content: center;
    text-align: center;
  }
}

.social-wrap {
  position: fixed;
  right: 20px;
  bottom: 380px; /* slightly below icons */
  text-align: center;
}

/* Chat note */
.mobile-chat-note {
  display: none;
  margin-top: 8px;
  font-family: "Cinzel", serif;
  font-size: 13px;
  opacity: 0.7;
  white-space: nowrap;
}

  .volume-area {
    margin-top: 0 !important;
  }
}

#scrollHint {
  position: sticky;
  bottom: 8px;

  text-align: center;
  font-size: 18px;
  opacity: 0;
  pointer-events: none;

  transition: opacity 0.3s ease;
  color: #000;
}

/* Visible when scrolling is possible */
#scrollHint.visible {
  opacity: 0.35;
}

/* Desktop / laptop only */
@media (min-width: 1200px) {
  .right-wrap {
    transform: translateX(120px); /* adjust value */
  }
}


  /* Hamburger button */
  #mobileMenuBtn {
    display: block;
    font-size: 26px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: Cinzel, serif;
  }

  /* Dropdown panel */
  #mobileMenu {
    position: absolute;

    right: 48px;
    background: #fff;
    border: 1px solid #000;
    border-radius: 8px;

  }

  #mobileMenu a:hover {

  }

  /* Open state */
  #mobileMenu.open {
    display: flex;
  }
}

#mobileMenuBtn {
  color: #000;
  -webkit-appearance: none;
  appearance: none;
}

#schedule {
  z-index: 900;
}

#schedule,
#schedule * {
  transform: translateZ(0);
}

/* =========================
   NEW SHOWS PULSING CTA
========================= */

.new-shows-cta{
  position: fixed;
  bottom: 40px;
  right: 340px; /* pushes it left of Chatango */
  font-family: "Cinzel", serif;
  font-size: 18px;
  font-weight: bold;
  color: #000;
  text-decoration: none;
  z-index: 9999;
  animation: pulseText 3s infinite;
  white-space: nowrap;
}

/* Hover */
.new-shows-cta:hover{
  text-decoration: underline;
}

/* Pulse animation */
@keyframes pulseText{
  0%{
    opacity: 1;
    transform: scale(1);
  }
  50%{
    opacity: 0.75;
    transform: scale(1.08);
  }
  100%{
    opacity: 1;
    transform: scale(1);
  }
}

/* Smaller screens */
@media (max-width: 780px){
  .new-shows-cta{
    right: 220px; /* adjust for smaller Chatango */
    font-size: 16px;
  }
}

/* Hide on very small phones */
@media (max-width: 480px){
  .new-shows-cta{
    display: none;
  }
}

.tz-note {
  font-size: 13px;
  font-weight: normal;
  opacity: 0.65;
  margin-left: 6px;
  font-style: italic;
}

/* =========================
   FLOATING NEW SHOWS PNG
========================= */

.new-shows-float {
  position: fixed;
  bottom: 85px;          /* sits above the text CTA */
  right: 340px;          /* aligned with New Shows text */
  width: 90px;
  height: auto;
  z-index: 9999;
  animation: floatPulse 3s infinite ease-in-out;
}

/* Float + pulse */
@keyframes floatPulse {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  50% {
    transform: translateY(-12px) scale(1.08);
    opacity: 0.8;
  }
  100% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

/* Smaller screens */
@media (max-width: 780px) {
  .new-shows-float {
    right: 220px;
    width: 70px;
  }
}

/* Hide on very small phones */
@media (max-width: 480px) {
  .new-shows-float {
    display: none;
  }
}

.new-shows-float-link {
  position: fixed;
  bottom: 85px;
  right: 340px;
  z-index: 10001;
}

.new-shows-float {
  width: 90px;
  height: auto;
  animation: floatPulse 3s infinite ease-in-out;
  cursor: pointer;
}

/* Hover glow */
.new-shows-float:hover {
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
  transform: scale(1.1);
}

@media (max-width: 780px) {
  #schedule {
    display: none;
  }

  #schedule:not(.collapsed) {
    display: block;
  }
}

/* Hidden by default (desktop) */
.mobile-new-shows {
  display: none;
}

/* =========================

========================= */

@media (max-width: 480px) {

}

@media (max-width: 480px) {
  #currentTrack {

@media (max-width: 780px) {
  nav.site-nav {

  }
}

/* =========================
   BACKGROUND COLOR PICKER
========================= */
#bgColorPicker {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 40px;
  height: 40px;
  border: 1px solid #000;
  border-radius: 6px;
  cursor: pointer;
  padding: 0;
  background: transparent;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Removes default inner borders on Chrome/Safari */
#bgColorPicker::-webkit-color-swatch-wrapper {
  padding: 0;
}
#bgColorPicker::-webkit-color-swatch {
  border: none;
  border-radius: 5px;
}

/* Removes default inner borders on Firefox */
#bgColorPicker::-moz-color-swatch {
  border: none;
  border-radius: 5px;
}

/* =========================
   DARK THEME AUTO-ADJUSTMENTS
========================= */
/* Only apply text color changes to these elements when the background is dark */
body.dark-theme,
body.dark-theme nav.site-nav a,
body.dark-theme #currentTrack,
body.dark-theme .new-shows-cta,
body.dark-theme #scrollHint,
body.dark-theme .tz-note {
  color: #ffffff !important;
}

/* DESKTOP SCHEDULE ADJUSTMENT */
/* On desktop, we want the schedule text to flip to white when the BG is dark */
@media (min-width: 481px) {
  body.dark-theme #schedule,
  body.dark-theme #schedule h2,
  body.dark-theme #schedule h3,
  body.dark-theme #scheduleContent div,
  body.dark-theme #schedule .show-title,
  body.dark-theme #signupText {
    color: #ffffff !important;
  }
}

/* MOBILE SCHEDULE PROTECTION */
/* On mobile, your schedule has a white background (#fff), 
   so we FORCE the text to stay black regardless of the body theme */
@media (max-width: 480px) {
  #schedule {
    background: #ffffff !important; /* Your existing white box */
  }
  #schedule, #schedule h2, #schedule h3, #scheduleContent div, #schedule .show-title, #signupText {
    color: #000000 !important;
  }
}

/* UI Elements that need to remain visible */
body.dark-theme #bgColorPicker,
body.dark-theme #scheduleToggle,
body.dark-theme #mobileMenu {
  border-color: #ffffff !important;
}

body.dark-theme #scheduleToggle {
  background: #222222 !important;
  color: #ffffff !important;
}

body.dark-theme .volume-slider input[type="range"] {
  background: #ffffff !important;
}

</style>

/* ======================

const trackElement = document.getElementById("currentTrack");
const liveImg = document.getElementById("liveStatusImg");

const STATUS_URL = "https://radio.jeromefm.live/status-json.xsl";

async function updateTrackAndStatus() {
  try {
    const res = await fetch(STATUS_URL);
    const data = await res.json();
    const source = data.icestats?.source;

    if (!source) {
      // OFFLINE
      trackElement.textContent = "Offline";
      liveImg.src = "images/offline.png";
      liveImg.style.display = "block";
      return;
    }

    // STREAM IS LIVE
    let title = "Live Broadcast";

    if (Array.isArray(source)) {
      title =
        source.find(s => s.listenurl?.includes("stream"))?.title ||
        title;
    } else if (source?.title) {
      title = source.title;
    }

    trackElement.textContent = title;
    liveImg.src = "images/Live-Now.png";
    liveImg.style.display = "block";

  } catch (err) {
    // Network error = treat as offline
    trackElement.textContent = "Offline";
    liveImg.src = "images/offline.jpg";
    liveImg.style.display = "block";
  }
}

function formatTime(timeStr) {
  // timeStr like "5:00 PM"
  const [time, modifier] = timeStr.split(" ");
  let [hours, minutes] = time.split(":").map(Number);

  if (modifier === "PM" && hours !== 12) hours += 12;
  if (modifier === "AM" && hours === 12) hours = 0;

  const d = new Date();
  d.setHours(hours, minutes, 0, 0);

  return d.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}


function dayIndex(dayName) {
  return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
    .indexOf(dayName);
}

  );

  sevenDaysLater.setDate(todayStart.getDate() + 7);

  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  if (modifier === "PM" && hours !== 12) hours += 12;
  if (modifier === "AM" && hours === 12) hours = 0;

  return new Date(year, month - 1, day, hours, minutes);
}

const endDate   = makeDate(dateStr, End);

/* ======================
   SCROLL HINT
====================== */
function updateScrollHint() {
  const schedule = document.getElementById("schedule");
  const hint = document.getElementById("scrollHint");

  if (!schedule || !hint) return;

  const canScroll = schedule.scrollHeight > schedule.clientHeight;
  const atBottom =
    schedule.scrollTop + schedule.clientHeight >=
    schedule.scrollHeight - 4;

  if (canScroll && !atBottom) {
    hint.classList.add("visible");
  } else {
    hint.classList.remove("visible");
  }
}

schedule.addEventListener("scroll", updateScrollHint);

/* ======================

const colorPicker = document.getElementById("bgColorPicker");

// Formula to check if a hex color is "dark"
function adjustTextColor(hexCode) {
  // Remove hash if present
  const hex = hexCode.replace('#', '');
  
  // Convert Hex to RGB
  const r = parseInt(hex.substr(0, 2), 16);
  const g = parseInt(hex.substr(2, 2), 16);
  const b = parseInt(hex.substr(4, 2), 16);
  
  // YIQ equation calculates perceived brightness
  const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
  
  // If brightness is below 128, it's dark. Add the dark-theme class!
  if (yiq < 128) {
    document.body.classList.add('dark-theme');
  } else {
    document.body.classList.remove('dark-theme');
  }
}

// Check if the user already saved a custom color previously
const savedColor = localStorage.getItem("jeromeFmBgColor");
if (savedColor) {
  document.body.style.backgroundColor = savedColor;
  colorPicker.value = savedColor;
  adjustTextColor(savedColor); // Check contrast on load
} else {
  // Check contrast on default color
  adjustTextColor(colorPicker.value);
}

// Update instantly when they drag the color slider
colorPicker.addEventListener("input", (e) => {
  const chosenColor = e.target.value;
  document.body.style.backgroundColor = chosenColor;
  adjustTextColor(chosenColor);
});

// Save to local storage
colorPicker.addEventListener("change", (e) => {
  localStorage.setItem("jeromeFmBgColor", e.target.value);
});
