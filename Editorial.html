<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerome FM - Editorial</title>
<link rel="icon" href="images/logo-left.png" type="image/png">

<style>
:root { --maxw: 1200px; }
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: #fff9df;
  color: #000;
  overflow-x: hidden;
  transition: background-color 0.3s ease;
}

/* TOPBAR MATCHING TRACK-HISTORY & EDITORIAL */
.topbar {
  max-width: 1600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid rgba(0,0,0,0.15);
}

#logo { height: 96px; width: auto; display: block; }
.right-wrap { display: flex; align-items: center; }

nav.site-nav {
  display: flex;
  gap: 20px;
  font-weight: 600;
  font-size: 18px;
}

nav.site-nav a {
  color: #000;
  text-decoration: none;
  position: relative;
  font-family: "Cinzel", serif;
}

nav.site-nav a:after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -4px; height: 2px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left;
  transition: .2s ease;
}

nav.site-nav a:hover:after { transform: scaleX(1); }

/* GRID & CARDS */
main {
  max-width: var(--maxw);
  margin: 40px auto;
  padding: 0 20px;
}

.header-wrap { text-align: center; }

h1 {
  font-family: "Cinzel", serif;
  font-size: 36px;
  margin-bottom: 40px;
  border-bottom: 2px solid #000;
  display: inline-block;
  padding-bottom: 10px;
}

.article-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 40px;
}

.article-card {
  text-decoration: none;
  color: inherit;
  transition: transform 0.2s ease;
  display: flex;
  flex-direction: column;
}

.article-card:hover { transform: translateY(-5px); }

.article-image {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #000;
  margin-bottom: 16px;
}

.article-meta {
  font-size: 13px;
  font-style: italic;
  opacity: 0.7;
  margin-bottom: 8px;
}

.article-title {
  font-family: "Cinzel", serif;
  font-size: 22px;
  font-weight: bold;
  margin: 0 0 10px 0;
  line-height: 1.2;
}

.article-excerpt {
  font-size: 15px;
  line-height: 1.5;
  opacity: 0.85;
}

/* DARK THEME ENGINE MATCHING TRACK-HISTORY */
body.dark-theme,
body.dark-theme h1,
body.dark-theme nav.site-nav a,
body.dark-theme .article-card {
  color: #ffffff !important;
  border-color: #ffffff !important;
}

body.dark-theme .topbar {
  border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <img id="logo" src="images/logo-left.png" alt="Station logo">
  </a>
  
  <div class="right-wrap">
    <nav class="site-nav">
      <a href="index.html">Jerome FM</a>
      <a href="shows.html">Shows</a>
      <a href="residents.html">Residents</a>
      <a href="Track-History.html">Track History</a>
    </nav>
  </div>
</header>

<main>
  <div class="header-wrap">
    <h1>Editorial</h1>
  </div>

  <div class="article-grid" id="editorialGrid">
    <!-- Articles load dynamically here -->
  </div>
</main>

<script>
// BACKGROUND THEME ENGINE
function adjustTextColor(hexCode) {
  const hex = hexCode.replace('#', '');
  const r = parseInt(hex.substr(0, 2), 16);
  const g = parseInt(hex.substr(2, 2), 16);
  const b = parseInt(hex.substr(4, 2), 16);
  const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
  
  if (yiq < 128) {
    document.body.classList.add('dark-theme');
  } else {
    document.body.classList.remove('dark-theme');
  }
}

(function() {
  const savedColor = localStorage.getItem("jeromeFmBgColor");
  if (savedColor) {
    document.body.style.backgroundColor = savedColor;
    adjustTextColor(savedColor);
  }
})();

// DYNAMIC EDITORIAL LOADER
async function loadEditorialArticles() {
  const grid = document.getElementById('editorialGrid');

  try {
    // 1. Fetch the list of articles from index.json
    const indexRes = await fetch('data/editorial/index.json');
    if (!indexRes.ok) throw new Error('Could not load index.json');
    const fileNames = await indexRes.json();

    // 2. Fetch each article file
    const articles = await Promise.all(
      fileNames.map(async (file) => {
        const res = await fetch(`data/editorial/${file}`);
        if (!res.ok) return null;
        const data = await res.json();
        return { ...data, slug: file.replace('.json', '') };
      })
    );

    const validArticles = articles
      .filter(Boolean)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (validArticles.length === 0) {
      grid.innerHTML = '<p>No articles found.</p>';
      return;
    }

    grid.innerHTML = validArticles.map(article => `
      <a class="article-card" href="article.html?id=${article.slug}">
        ${article.image ? `<img class="article-image" src="${article.image.replace('../', '')}" alt="${article.title}">` : ''}
        <div class="article-meta">By ${article.author || 'Anonymous'} • ${article.date || ''}</div>
        <h2 class="article-title">${article.title}</h2>
        ${article.excerpt ? `<p class="article-excerpt">${article.excerpt}</p>` : ''}
      </a>
    `).join('');

  } catch (err) {
    console.error('Error loading articles:', err);
    grid.innerHTML = '<p>Unable to load articles.</p>';
  }
}

document.addEventListener('DOMContentLoaded', loadEditorialArticles);
</script>

</body>
</html>
