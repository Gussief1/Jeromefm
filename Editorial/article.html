<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title id="pageTitle">Article - Jerome FM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../images/logo-left.png">

<style>
  :root { --maxw: 800px; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #fff9df;
    color: #000;
  }

  .top-right-links {
    position: fixed;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 16px;
    z-index: 1000;
  }
  .top-right-links a { color: #000; text-decoration: none; font-weight: 600; }
  .top-right-links a:hover { text-decoration: underline; }

  main {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 80px 20px 60px;
  }

  .article-image {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #000;
    margin-bottom: 24px;
  }

  .article-meta {
    font-size: 14px;
    font-style: italic;
    opacity: 0.7;
    margin-bottom: 12px;
  }

  h1.article-title {
    font-family: "Cinzel", serif;
    font-size: 32px;
    margin: 0 0 8px 0;
    line-height: 1.2;
  }

  .article-body {
    font-size: 17px;
    line-height: 1.7;
    margin-top: 24px;
  }

  .back-link { display: inline-block; margin-top: 40px; color: #000; }
</style>
</head>
<body>

<div class="top-right-links">
  <a href="../index.html">Jerome FM</a>
  <a href="../Editorial.html">Editorial</a>
</div>

<main>
  <div class="article-meta" id="articleMeta"></div>
  <h1 class="article-title" id="articleTitle">Loading...</h1>
  <img id="articleImage" class="article-image" src="" alt="" style="display:none;">
  <div class="article-body" id="articleBody"></div>

  <a href="../Editorial.html" class="back-link">← Back to Editorial</a>
</main>

<script>
  async function loadArticle() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('articleTitle').textContent = 'Article Not Found';
      return;
    }

    try {
      const res = await fetch(`../data/editorial/${id}.json`);
      if (!res.ok) throw new Error('File not found');
      const data = await res.json();

      document.getElementById('pageTitle').textContent = `${data.title} - Jerome FM`;
      document.getElementById('articleTitle').textContent = data.title;
      document.getElementById('articleMeta').textContent =
        `By ${data.author || 'Anonymous'} • ${data.date ? new Date(data.date).toDateString() : ''}`;

      if (data.image) {
        const img = document.getElementById('articleImage');
        img.src = data.image;
        img.alt = data.title;
        img.style.display = 'block';
      }

      if (data.body) {
        document.getElementById('articleBody').innerHTML = data.body;
      }
    } catch (e) {
      document.getElementById('articleTitle').textContent = 'Article Not Found';
    }
  }

  loadArticle();
</script>

</body>
</html>
